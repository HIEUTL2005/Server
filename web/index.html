<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background: black;
            color: #00ff00;
            font-family: monospace;
        }
        #output {
            white-space: pre-wrap;
        }
        input {
            width: 100%;
            background: black;
            color: #00ff00;
            border: none;
            outline: none;
        }
    </style>
</head>
<body>

<div id="output">$ </div>
<input id="cmd" autofocus autocomplete="off">

<script>
const input = document.getElementById("cmd");
const output = document.getElementById("output");

input.addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        let command = input.value;
        output.innerText += command + "\n";

        fetch("/run", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({cmd: command})
        })
        .then(res => res.text())
        .then(data => {
            output.innerText += data + "\n$ ";
        });

        input.value = "";
    }
});
</script>

</body>
</html>
